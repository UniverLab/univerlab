name: Build the site
description: >
  Checks out the sibling repos the landing globs at build time (docs/ folders,
  registries) next to an already checked-out univerlab/, then builds dist.
  Shared by the release deploy and the preview deploy so both build the same
  thing. The caller checks out this repo into univerlab/ first.
inputs:
  github-token:
    description: Lifts the GitHub API rate limit for the build-time fetches.
    required: true
  turnstile-site-key:
    description: Public Turnstile site key for the booking form.
    required: true
runs:
  using: composite
  steps:
    # Sibling repos — ONLY their docs/ folder (sparse checkout, cone mode).
    # These org repos are public, so the default token can read them.
    #
    # `fetch-depth: 0` is load-bearing: a docs page's `dateModified` is the
    # last commit of its source file, read with `git log -1` in this checkout
    # (see src/lib/doc-last-modified.ts). The default shallow clone would make
    # every file look freshly committed at checkout time, so the helper
    # refuses to date a shallow repo — which is the correct fallback, but it
    # would silently cost every page its freshness signal. Full history is
    # what makes the dates real.
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/harness-canopy
        path: harness-canopy
        sparse-checkout: docs
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/texforge
        path: texforge
        sparse-checkout: docs
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/gitkit
        path: gitkit
        sparse-checkout: docs
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/ghscaff
        path: ghscaff
        sparse-checkout: docs
        fetch-depth: 0
    # The repository is `demostage` (the old `demo-stage` name 302s to it)
    # and the path has to be `demostage` because DOCS_BASES in
    # src/data/docs-bases.ts reads `../demostage/docs`. Under `demo-stage`
    # the collection resolved to nothing, `getCollection` returned `[]` with
    # a warning, and the eight DemoStage docs never built.
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/demostage
        path: demostage
        sparse-checkout: docs
        fetch-depth: 0
    # Canopy registry — platforms/ directory for platform badges
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/canopy-registry
        path: canopy-registry
        sparse-checkout: platforms
        fetch-depth: 0
    # TeXForge templates — registry.toml for the template catalogue
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/texforge-templates
        path: texforge-templates
        sparse-checkout: registry.toml
        sparse-checkout-cone-mode: false
    # ghScaff boilerplates — template.toml heads for the boilerplate catalogue
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/ghscaff-boilerplate
        path: ghscaff-boilerplate
        sparse-checkout: '*/template.toml'
        sparse-checkout-cone-mode: false
    # facetMedia's capability table — the full registry (packages/ plus
    # index.toml), read at build time from ../facetmedia-registry. The ref
    # lives in one place, scripts/facet-registry.json: feature/v0.1 until
    # facet releases, main after.
    - name: Read facetmedia-registry pin
      id: facet-registry
      working-directory: univerlab
      shell: bash
      run: |
        echo "repository=$(node -p "require('./scripts/facet-registry.json').repository")" >> $GITHUB_OUTPUT
        echo "ref=$(node -p "require('./scripts/facet-registry.json').ref")" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.facet-registry.outputs.repository }}
        ref: ${{ steps.facet-registry.outputs.ref }}
        path: facetmedia-registry
    # facetMedia's docs come from the same pinned ref as its registry
    # (scripts/facet-registry.json): they only exist on feature/v0.1 until
    # facet releases, and the facet page links /facetmedia/docs/.
    - uses: actions/checkout@v4
      with:
        repository: UniverLab/facetmedia
        ref: ${{ steps.facet-registry.outputs.ref }}
        path: facetmedia
        sparse-checkout: docs
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: univerlab/package-lock.json

    - name: Build
      working-directory: univerlab
      env:
        # Lifts the GitHub API rate limit for the build-time fetches: the
        # contributors wall and each experiment's latest release plate segment.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # The booking page reads these at build time (PUBLIC_*): the free
        # first-call service and the Turnstile site key guarding its form.
        PUBLIC_BOOKING_API: https://agenda.univerlab.org
        PUBLIC_TURNSTILE_SITE_KEY: ${{ inputs.turnstile-site-key }}
      shell: bash
      run: |
        npm ci
        npm run build
