name: Deploy get worker

# Deploys workers/get (get.univerlab.org) to Cloudflare. Run by hand: in the
# trunk-based flow nothing deploys on merge. The site is deploy-site.yml.
on:
  workflow_dispatch: {}

jobs:
  ci:
    name: CI on main
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/get
          wranglerVersion: '4.111.0'
          command: deploy
