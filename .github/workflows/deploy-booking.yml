name: Deploy booking worker

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    name: CI on main
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/booking/package-lock.json

      - name: Install dependencies
        working-directory: workers/booking
        run: npm ci

      - name: Typecheck
        working-directory: workers/booking
        run: npm run typecheck

      # No wranglerVersion pin: the action reuses the wrangler from package-lock,
      # so CI and local deploy the same version.
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/booking
          command: deploy
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_REFRESH_TOKEN
            TURNSTILE_SECRET
            INTERNAL_CALL_SECRET
          # The calendar id and the booking configuration are configuration,
          # not code: change the repository variables and re-run this
          # workflow, no commit or release needed.
          vars: |
            WORKBENCH_CALENDAR_ID
            BOOKING_CONFIG
            BOOKING_DIGEST_CONFIG
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          INTERNAL_CALL_SECRET: ${{ secrets.BOOKING_INTERNAL_CALL_SECRET }}
          WORKBENCH_CALENDAR_ID: ${{ vars.BOOKING_CALENDAR_ID }}
          BOOKING_CONFIG: ${{ vars.BOOKING_CONFIG_JSON }}
          BOOKING_DIGEST_CONFIG: ${{ vars.BOOKING_DIGEST_JSON }}
