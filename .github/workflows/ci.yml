name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: univerlab

      # Sibling repos — ONLY their docs/ folder (sparse checkout, cone mode).
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/harness-canopy
          path: harness-canopy
          sparse-checkout: docs
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/texforge
          path: texforge
          sparse-checkout: docs
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/gitkit
          path: gitkit
          sparse-checkout: docs
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/ghscaff
          path: ghscaff
          sparse-checkout: docs
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/cadspec
          path: cadspec
          sparse-checkout: docs
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/demo-stage
          path: demo-stage
          sparse-checkout: docs
      # Canopy registry — platforms/ directory for platform badges
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/canopy-registry
          path: canopy-registry
          sparse-checkout: platforms

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: univerlab/package-lock.json

      - name: Install
        working-directory: univerlab
        run: npm ci

      - name: Build
        working-directory: univerlab
        run: npm run build

      - name: Test
        working-directory: univerlab
        run: npm run test:coverage

      - name: Check i18n
        working-directory: univerlab
        run: npm run check:i18n

  main-pr-version-bump:
    name: Main PR Version Bump
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check version bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show origin/main:package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => process.stdout.write(JSON.parse(data).version))")

          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version in package.json must be bumped for a main PR"
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION -> $CURRENT_VERSION"
