name: Deploy site (Cloudflare Pages)

# The landing globs each tool repo's docs/ at build time (../<repo>/docs).
# Cloudflare Pages' own Git build only checks out THIS repo, so the docs would
# be missing. Instead we build here in CI: check out this repo plus a
# sparse-checkout of just the docs/ folder of each sibling, then publish dist
# with Wrangler. Fires on push to main (after demos land) or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow:
        description: 'Submit sitemap to IndexNow after deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        id: create
        run: |
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            echo "created=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "created=true" >> $GITHUB_OUTPUT

  deploy:
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing
        uses: actions/checkout@v4
        with:
          path: univerlab

      # Sibling repos — ONLY their docs/ folder (sparse checkout, cone mode).
      # These org repos are public, so the default token can read them.
      #
      # `fetch-depth: 0` is load-bearing: a docs page's `dateModified` is the
      # last commit of its source file, read with `git log -1` in this checkout
      # (see src/lib/doc-last-modified.ts). The default shallow clone would make
      # every file look freshly committed at checkout time, so the helper
      # refuses to date a shallow repo — which is the correct fallback, but it
      # would silently cost every page its freshness signal. Full history is
      # what makes the dates real.
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/harness-canopy
          path: harness-canopy
          sparse-checkout: docs
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/texforge
          path: texforge
          sparse-checkout: docs
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/gitkit
          path: gitkit
          sparse-checkout: docs
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/ghscaff
          path: ghscaff
          sparse-checkout: docs
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/cadspec
          path: cadspec
          sparse-checkout: docs
          fetch-depth: 0
      # The repository is `demostage` (the old `demo-stage` name 302s to it)
      # and the path has to be `demostage` because DOCS_BASES in
      # src/data/docs-bases.ts reads `../demostage/docs`. Under `demo-stage`
      # the collection resolved to nothing, `getCollection` returned `[]` with
      # a warning, and the eight DemoStage docs never built.
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/demostage
          path: demostage
          sparse-checkout: docs
          fetch-depth: 0
      # Canopy registry — platforms/ directory for platform badges
      - uses: actions/checkout@v4
        with:
          repository: UniverLab/canopy-registry
          path: canopy-registry
          sparse-checkout: platforms
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: univerlab/package-lock.json

      - name: Build
        working-directory: univerlab
        env:
          # Lifts the GitHub API rate limit when fetching the contributors wall.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build

      # `workingDirectory` is load-bearing, not tidiness. Wrangler discovers
      # Pages Functions in `./functions` relative to its own working directory,
      # and this job checks the landing out into `univerlab/` so the sibling
      # repos can sit next to it. Deploying `univerlab/dist` from the workspace
      # root meant wrangler looked for `functions/` at the root, found nothing,
      # and shipped the site without its middleware — silently, because a
      # missing Function is not an error. That is how markdown negotiation was
      # unit-tested, merged, released and still absent in production.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.111.0'
          workingDirectory: univerlab
          command: pages deploy dist --project-name=univerlab

      # The contract the middleware exists to keep, checked against the live
      # origin rather than against the source. A unit test proves the routing
      # logic; only this proves the routing logic was deployed.
      - name: Verify the agent-facing surface is live
        run: |
          # `wrangler pages deploy` returns before Pages promotes the new
          # deployment onto the production domain, so every assertion here has
          # to be able to wait. Without that, a green check means "the previous
          # deploy was fine" and a red one may mean nothing at all — the first
          # version of this step asserted the two Content-Types once and failed
          # on a deploy whose result was correct seconds later.
          expect_content_type() {
            url=$1
            expected=$2
            header=${3:-}
            for attempt in 1 2 3 4 5 6; do
              if [ -n "$header" ]; then
                ct=$(curl -sS -o /dev/null -w '%{content_type}' -H "$header" "$url" || true)
              else
                ct=$(curl -sS -o /dev/null -w '%{content_type}' "$url" || true)
              fi
              if [ "$ct" = "$expected" ]; then
                echo "ok: $url -> $ct"
                return 0
              fi
              echo "attempt $attempt: $url served '$ct', waiting for the deployment to go live"
              sleep 20
            done
            echo "::error::$url served Content-Type '$ct'; expected exactly '$expected'"
            return 1
          }

          # Content negotiation: the middleware has to be bundled and running.
          # A missing Functions bundle is not a deploy error, which is how this
          # shipped broken and stayed green for a week.
          expect_content_type https://univerlab.org/ \
            'text/markdown; charset=utf-8' 'Accept: text/markdown'

          # Exact match, never a prefix: Pages applies every matching _headers
          # rule and joins their values, so an overlapping rule produces
          # 'application/json; charset=utf-8, text/markdown; charset=utf-8' —
          # right prefix, unparseable value.
          index=https://univerlab.org/.well-known/agent-skills/index.json
          expect_content_type "$index" 'application/json; charset=utf-8'

          # And a skill taken from the index itself, so the assertion follows
          # whatever the index actually advertises.
          skill=$(curl -sS "$index" | grep -m1 '"url"' | sed 's/.*: "//; s/",*$//')
          expect_content_type "$skill" 'text/markdown; charset=utf-8'

      # IndexNow notifies Bing (and through it Copilot) plus the other
      # participating engines about changed pages on each release deploy.
      # Runs after the verify step so a failed verify blocks notification.
      # Warn-only by design: any non-200/202 status or network error is
      # reported as a workflow warning and never fails the deploy.
      - name: Notify IndexNow
        if: github.event_name != 'workflow_dispatch' || inputs.indexnow == true
        working-directory: univerlab
        env:
          # IndexNow keys are public by design (served at the keyLocation URL).
          INDEXNOW_KEY: 3af77270f75a7a2e2f2c55b12e13bba7
        run: |
          set -euo pipefail
          HOST="univerlab.org"
          KEY="${INDEXNOW_KEY}"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"

          test -f "dist/${KEY}.txt" || { echo "::warning::IndexNow key file dist/${KEY}.txt missing — skipping"; exit 0; }

          # All sitemap page URLs from the BUILD OUTPUT (never the live site).
          # sitemap-*.xml also matches sitemap-index.xml whose <loc> points at
          # the child sitemap file itself, so drop any loc ending in .xml.
          URLS=$(grep -ho '<loc>[^<]*</loc>' dist/sitemap-*.xml \
            | sed -e 's/<[^>]*>//g' \
            | grep "^https://${HOST}/" \
            | grep -v '\.xml$' \
            | sort -u)
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          [ "$COUNT" -gt 0 ] || { echo "::warning::IndexNow: no sitemap URLs found — skipping"; exit 0; }

          PAYLOAD=$(printf '%s\n' "$URLS" | HOST="$HOST" KEY="$KEY" KEY_LOCATION="$KEY_LOCATION" node -e '
            let data = "";
            process.stdin.on("data", (c) => { data += c; }).on("end", () => {
              const urlList = data.split("\n").map((s) => s.trim()).filter(Boolean);
              process.stdout.write(JSON.stringify({
                host: process.env.HOST,
                key: process.env.KEY,
                keyLocation: process.env.KEY_LOCATION,
                urlList,
              }));
            });
          ')

          if [ "${INDEXNOW_DRY_RUN:-0}" = "1" ]; then printf '%s\n' "$PAYLOAD"; exit 0; fi

          BODY=$(mktemp)
          # `|| true` is load-bearing: curl's nonzero exit on network error must
          # not fail the deploy under `set -e`; every path below exits 0.
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD" || true)
          echo "IndexNow submission: HTTP ${STATUS:-000}, ${COUNT} URLs"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "202" ]; then exit 0; fi
          echo "::warning::IndexNow returned HTTP ${STATUS:-000}: $(cat "$BODY")"
          exit 0
