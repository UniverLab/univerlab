<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- The lab's sun (2026-10-27): a hatched engraved disc and twelve fine rays,
       long and short in turn, in one muted sepia ink. Fixed colours: the
       header tints it softly at dawn and dusk with a CSS filter. -->
  <defs>
    <pattern id="sol-h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 3H6" stroke="#5b4a36" stroke-width="1.4" opacity=".45"/></pattern>
    <clipPath id="sol-c"><circle cx="60" cy="60" r="25"/></clipPath>
  </defs>
  <g stroke="#5b4a36" stroke-width="3.2" stroke-linecap="round">
    <line x1="60.00" y1="27.00" x2="60.00" y2="4.00"/>
    <line x1="76.50" y1="31.42" x2="83.00" y2="20.16"/>
    <line x1="88.58" y1="43.50" x2="108.50" y2="32.00"/>
    <line x1="93.00" y1="60.00" x2="106.00" y2="60.00"/>
    <line x1="88.58" y1="76.50" x2="108.50" y2="88.00"/>
    <line x1="76.50" y1="88.58" x2="83.00" y2="99.84"/>
    <line x1="60.00" y1="93.00" x2="60.00" y2="116.00"/>
    <line x1="43.50" y1="88.58" x2="37.00" y2="99.84"/>
    <line x1="31.42" y1="76.50" x2="11.50" y2="88.00"/>
    <line x1="27.00" y1="60.00" x2="14.00" y2="60.00"/>
    <line x1="31.42" y1="43.50" x2="11.50" y2="32.00"/>
    <line x1="43.50" y1="31.42" x2="37.00" y2="20.16"/>
  </g>
  <circle cx="60" cy="60" r="25" fill="#f3ebd9"/>
  <rect x="35" y="35" width="50" height="50" fill="url(#sol-h)" clip-path="url(#sol-c)"/>
  <circle cx="60" cy="60" r="25" fill="none" stroke="#5b4a36" stroke-width="4"/>
</svg>
