name = "univerlab-booking"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CALENDAR"
class_name = "Calendar"

[[durable_objects.bindings]]
name = "GATE"
class_name = "Gate"

# SQLite-backed is required on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Calendar"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gate"]

# The OPERATOR service binding to univerlab-whatsapp (same-day booking lines
# and the morning digest) returns once that worker is deployed: Cloudflare
# refuses a binding to a worker that does not exist, and the code already
# treats a missing OPERATOR as "no notification".
# [[services]]
# binding = "OPERATOR"
# service = "univerlab-whatsapp"

# Domains/routes are managed in UniverLab/infra (Terraform).

[observability]
enabled = true

[triggers]
crons = ["*/30 * * * *"]
