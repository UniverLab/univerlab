name = "univerlab-whatsapp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Operator"

[[durable_objects.bindings]]
name = "CALENDAR"
class_name = "Calendar"

# SQLite-backed is required on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversation"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Operator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Calendar"]

[observability]
enabled = true
