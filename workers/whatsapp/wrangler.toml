name = "univerlab-whatsapp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "SITE_STATE"
id = "6456e427df724870ba557449758fe47d"

[[durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Operator"

# The standalone booking worker (booking.univerlab.org): every calendar
# read and write goes through this binding, never a local Durable Object.
[[services]]
binding = "BOOKING"
service = "univerlab-booking"

# SQLite-backed is required on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversation"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Operator"]

# Domains/routes managed in UniverLab/infra (Terraform).

[observability]
enabled = true
