name = "univerlab-get"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Aggregate install counting. Analytics Engine is the right store here: writes
# are fire-and-forget (no latency added to the redirect), there is no database
# to provision, and it is built for exactly this shape of high-volume, low-value
# event. KV would need read-modify-write and rate-limits at 1 write/sec/key;
# D1 would put a SQL write in the hot path of every install.
#
# REQUIRED FIRST: Analytics Engine must be enabled once on the account, at
# dash.cloudflare.com → Storage & databases → Analytics Engine (NOT under
# Compute/Workers, despite what the error message links to). Until it is, every
# deploy that declares this binding fails with `code: 10089`, no matter what
# permissions the API token has. The dataset itself needs no provisioning — it
# is created on the first write; ignore the dashboard's "Create Dataset" button.
#
# The binding is optional in code — `wrangler dev` without it still serves.
[[analytics_engine_datasets]]
binding = "INSTALLS"
dataset = "univerlab_installs"

# Two hostnames, one Worker. `get` is the short one that matches the
# convention users already know (get.docker.com, get.helm.sh); `install` is
# the explicit one, for documentation where saying what the command does
# out loud is worth four extra characters. Neither is a redirect to the
# other — both enter the same `fetch`, so the code never learns which was
# used and nothing needs to change when a new one is added.
#
# Bound as Custom Domains: Workers & Pages → this Worker → Settings →
# Domains & Routes → Custom Domain (Cloudflare provisions the TLS cert).
#
# The declarative form below is deliberately left commented. Enabling it
# makes `wrangler deploy` the authority on which hostnames are attached,
# and get.univerlab.org is the install URL for every tool in the workspace
# — not something to hand to a reconciliation step in exchange for
# convenience. If you ever do enable it, list BOTH patterns:
#
# routes = [
#   { pattern = "get.univerlab.org",     custom_domain = true },
#   { pattern = "install.univerlab.org", custom_domain = true },
# ]
