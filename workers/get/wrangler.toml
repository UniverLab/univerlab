name = "univerlab-get"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Aggregate install counting. Analytics Engine is the right store here: writes
# are fire-and-forget (no latency added to the redirect), there is no database
# to provision, and it is built for exactly this shape of high-volume, low-value
# event. KV would need read-modify-write and rate-limits at 1 write/sec/key;
# D1 would put a SQL write in the hot path of every install.
#
# REQUIRED FIRST: Analytics Engine must be enabled once on the account, at
# dash.cloudflare.com → Storage & databases → Analytics Engine (NOT under
# Compute/Workers, despite what the error message links to). Until it is, every
# deploy that declares this binding fails with `code: 10089`, no matter what
# permissions the API token has. The dataset itself needs no provisioning — it
# is created on the first write; ignore the dashboard's "Create Dataset" button.
#
# The binding is optional in code — `wrangler dev` without it still serves.
[[analytics_engine_datasets]]
binding = "INSTALLS"
dataset = "univerlab_installs"

# Bind to the subdomain once univerlab.org is on Cloudflare. Easiest path:
# Workers & Pages → this Worker → Settings → Domains & Routes → add a
# Custom Domain: get.univerlab.org  (Cloudflare provisions the TLS cert).
#
# Or, declaratively (requires the zone on this account):
# routes = [{ pattern = "get.univerlab.org", custom_domain = true }]
